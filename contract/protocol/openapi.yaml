openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: NMZP Canonical Protocol candidate
  version: 0.0.0-candidate
  x-nmzp-status: PROPOSED
  description: >
    fields.contents 使用精确 leaves；evaluate 必须携带瞬态 rewriteLayout，支持真实 HOOK 与 PROBE 源对象复原。非赢家 alias 计入既有 extras。旧 CanonicalDecision / CanonicalRewrite 候选保留独立定义，不是 evaluate 实际响应。
    WP-21 外部候选。未冻结。不是 Claude 批准，也不证明 G8 或 P2。
    JSON Schema 文件是本候选的结构合同。PROTOCOL 正文仍是未冻结的 Gate A 说明。
    ErrorCode 枚举见 components.schemas.ErrorCode，按 r3 的两组代码写入，每个成员有 description 和 x-remediation。这仍不是协议冻结。lint:contract 检查 v2Error 的字面量 code、每个成员的 description 与 x-remediation、error-envelope 的 code 枚举顺序，以及生成类型逐字节一致。
    五条路由均要求设备 bearer token；没有 JWT 或 admin-cookie 替代。认证先于正文与业务处理。evaluate 正文 device.id 必须与 token 相同，否则 401 unauthorized。
    /api/v2/receipts、/api/v2/backfill、/api/v2/heartbeat 的成功正文与 v1 成功正文逐字段相同，失败使用错误信封。这三条路由的请求正文按现有 v1 解析器写入，运行时约束见 schema 描述；不是运行时接线或冻结证明。
    四条非 evaluate 设备路由接入共享 v1 业务分支；evaluate 使用共享持久评估应用及独立兼容 ingress。IC 均未切换，G8 OPEN，协议仍未冻结；合同文件不构成性能或发布证明。
security:
  - deviceBearer: []
servers:
  - url: https://device-listener.invalid
    description: 占位。不是生产地址，本候选不连接它。
paths:
  /api/v2/evaluate:
    post:
      operationId: evaluate
      summary: CanonicalEvaluateRequestV2 进，真实 CanonicalEvaluateResponseV2 出
      description: >
        已接真实共享应用。设备认证先于正文，政策快照取于正文等待之前。V2 评估要求 SQLite。
        原事件沿用原协议；不同协议重试返回 event_protocol_incompatible。相同 canonical 请求哈希（仅排除 context.uploadSize）返回首次不可变结果和观察，requestHash 将响应绑定到该请求。
        本路由使用兼容结构 schema；IC-10 严格 id/额外字段/深度限制仍关闭，不会隐式启用。
        正文及完整响应分别最多 262144 UTF-8 字节；不截断。响应保存完整真实 edits，明确省略 full trace 并给出真实 hash/count。
        停止/范围外结果有最小私有重试记录，不进入公开审计。历史实现不匹配明确报错，不重跑当前引擎。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/canonical-evaluate-request-v2.schema.json
      responses:
        "401":
          description: Device authentication or body device binding failed; unauthorized, or heartbeat probe_proof_required. No data.
          content:
            application/json:
              schema:
                $ref: ./schemas/error-envelope.schema.json
        "200":
          description: 真实版本化 compact 响应；不是旧兼容占位 CanonicalDecision。
          content:
            application/json:
              schema:
                $ref: ./schemas/canonical-evaluate-response-v2.schema.json
        "409":
          description: event_conflict、event_protocol_incompatible、evaluation_replay_unavailable 或 event_expired。错误正文使用错误信封；不同于回填回执最终 enforcement 的 conflict。
          content:
            application/json:
              schema:
                $ref: ./schemas/error-envelope.schema.json
        default:
          description: 错误信封。error.code 使用 ErrorCode。状态码与 code 的完整配对表不是本候选的冻结条文。
          content:
            application/json:
              schema:
                $ref: ./schemas/error-envelope.schema.json
  /api/v2/receipts:
    post:
      operationId: submitReceipt
      summary: hook 回执
      description: >
        PROTOCOL 写明该路由推进 DECISION_RETURNED。成功正文与 v1 POST /api/v1/receipt 的 200 正文逐字段相同。失败使用 v2 错误信封。请求正文沿用 v1 解析语义，见对应 request schema。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/receipt-request.schema.json
      responses:
        "401":
          description: Device authentication or body device binding failed; unauthorized, or heartbeat probe_proof_required. No data.
          content:
            application/json:
              schema:
                $ref: ./schemas/error-envelope.schema.json
        "200":
          description: 与 v1 回执成功正文逐字段相同。
          content:
            application/json:
              schema:
                $ref: ./schemas/receipt-response.schema.json
        "403":
          description: forbidden; authenticated device cannot update the event. No data.
          content:
            application/json:
              schema:
                $ref: ./schemas/error-envelope.schema.json
        "404":
          description: not_found; receipt target event does not exist. Backfill also retains storage_not_enabled. No data.
          content:
            application/json:
              schema:
                $ref: ./schemas/error-envelope.schema.json
        default:
          description: 失败使用 v2 错误信封。状态码与 code 的完整配对表不是本候选的冻结条文。
          content:
            application/json:
              schema:
                $ref: ./schemas/error-envelope.schema.json
  /api/v2/backfill:
    post:
      operationId: backfill
      summary: 离线决策回填
      description: >
        成功正文与 v1 POST /api/v1/audit/backfill 的 200 正文逐字段相同。回执回填带 enforcement，事件回填不带。失败使用 v2 错误信封。请求正文沿用 v1 解析语义，见对应 request schema。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/backfill-request.schema.json
      responses:
        "401":
          description: Device authentication or body device binding failed; unauthorized, or heartbeat probe_proof_required. No data.
          content:
            application/json:
              schema:
                $ref: ./schemas/error-envelope.schema.json
        "200":
          description: 与 v1 回填成功正文逐字段相同。
          content:
            application/json:
              schema:
                $ref: ./schemas/backfill-response.schema.json
        "403":
          description: forbidden; authenticated device cannot update the event. No data.
          content:
            application/json:
              schema:
                $ref: ./schemas/error-envelope.schema.json
        "404":
          description: not_found; receipt target event does not exist. Backfill also retains storage_not_enabled. No data.
          content:
            application/json:
              schema:
                $ref: ./schemas/error-envelope.schema.json
        default:
          description: 失败使用 v2 错误信封。状态码与 code 的完整配对表不是本候选的冻结条文。
          content:
            application/json:
              schema:
                $ref: ./schemas/error-envelope.schema.json
  /api/v2/heartbeat:
    post:
      operationId: heartbeat
      summary: 有界心跳
      description: >
        兼容别名：NMZP-PROBE-1 签名前像继续包含 POST /api/v1/heartbeat；设备、单次 nonce 与原始正文 bytes 绑定不变。
        请求基础字段沿用现有 M-08 parseHeartbeatBody；辅助证据仍调用原有解析器。成功正文与 v1 POST /api/v1/heartbeat 的 200 正文逐字段相同。失败使用 v2 错误信封。请求正文沿用 v1 解析语义，见对应 request schema。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/heartbeat-request.schema.json
      responses:
        "401":
          description: Device authentication or body device binding failed; unauthorized, or heartbeat probe_proof_required. No data.
          content:
            application/json:
              schema:
                $ref: ./schemas/error-envelope.schema.json
        "200":
          description: 与 v1 心跳成功正文逐字段相同。
          content:
            application/json:
              schema:
                $ref: ./schemas/heartbeat-response.schema.json
        default:
          description: 失败使用 v2 错误信封。状态码与 code 的完整配对表不是本候选的冻结条文。
          content:
            application/json:
              schema:
                $ref: ./schemas/error-envelope.schema.json
  /api/v2/policy:
    get:
      operationId: getPolicy
      summary: 设备策略拉取
      description: >
        强 ETag 字节格式为 "p<policyVersion>.<rulesHashHex>.e<engineRevision>"，含两侧双引号。
        rulesHashHex 为 64 位小写十六进制，不含 sha256:。policyVersion 与 engineRevision 是非负十进制整数，不补前导零。
        If-None-Match 与该字节逐字节相等，或按逗号切开后任一段逐字节相等，则 304，无正文，响应带同一个 ETag。
        段不修剪空白。W/ 开头的弱标签与 * 不命中，此时返回 200。
      parameters:
        - in: header
          name: If-None-Match
          required: false
          schema:
            type: string
          description: >
            与当前强 ETag 逐字节相等，或逗号列表中任一段逐字节相等，则 304。
            不修剪空白。W/ 弱标签与 * 不命中。
      responses:
        "401":
          description: Device authentication or body device binding failed; unauthorized, or heartbeat probe_proof_required. No data.
          content:
            application/json:
              schema:
                $ref: ./schemas/error-envelope.schema.json
        "200":
          description: 与 GET /api/v1/policy 正文字段相同，另加 rulesHash。响应带强 ETag。
          headers:
            ETag:
              required: true
              schema:
                $ref: "#/components/schemas/PolicyETag"
              description: 强 ETag。字节格式见 PolicyETag。
          content:
            application/json:
              schema:
                $ref: ./schemas/policy-response.schema.json
        "304":
          description: If-None-Match 命中。无正文。响应带同一个强 ETag。
          headers:
            ETag:
              required: true
              schema:
                $ref: "#/components/schemas/PolicyETag"
              description: 与 200 相同的强 ETag。
        default:
          description: 失败使用 v2 错误信封。状态码与 code 的完整配对表不是本候选的冻结条文。
          content:
            application/json:
              schema:
                $ref: ./schemas/error-envelope.schema.json
components:
  securitySchemes:
    deviceBearer:
      type: http
      scheme: bearer
      description: >
        Existing device bearer token, resolved with revoked-device exclusion. Not JWT.
        Authentication precedes body processing. Bound heartbeat devices additionally
        require the existing raw-byte probe proof; bearer alone does not replace it.
        /api/v2/heartbeat is a compatibility alias of the same logical heartbeat resource:
        NMZP-PROBE-1 still signs POST /api/v1/heartbeat, device identity, one-use nonce,
        and the exact original body bytes. No v2-path signature version is introduced.
  schemas:
    CanonicalToolEvent:
      $ref: ./schemas/canonical-tool-event.schema.json
    CanonicalEvaluateRequestV2:
      $ref: ./schemas/canonical-evaluate-request-v2.schema.json
    CanonicalEvaluateRequestV2Strict:
      $ref: ./schemas/canonical-evaluate-request-v2-strict.schema.json
    CanonicalEvaluateResponseV2:
      $ref: ./schemas/canonical-evaluate-response-v2.schema.json
    CompactRenderedRewrite:
      $ref: ./schemas/compact-rendered-rewrite.schema.json
    CanonicalDecision:
      $ref: ./schemas/canonical-decision.schema.json
    RewriteLayout:
      $ref: ./schemas/rewrite-layout.schema.json
    RenderedRewriteEvidence:
      $ref: ./schemas/rendered-rewrite-evidence.schema.json
    RewriteReplayWitness:
      $ref: ./schemas/rewrite-replay-witness.schema.json
    CanonicalRewrite:
      $ref: ./schemas/canonical-rewrite.schema.json
    CanonicalEvidence:
      $ref: ./schemas/canonical-evidence.schema.json
    ErrorEnvelope:
      $ref: ./schemas/error-envelope.schema.json
    PolicyResponse:
      $ref: ./schemas/policy-response.schema.json
    ReceiptRequest:
      $ref: ./schemas/receipt-request.schema.json
    BackfillRequest:
      $ref: ./schemas/backfill-request.schema.json
    HeartbeatRequest:
      $ref: ./schemas/heartbeat-request.schema.json
    UploadSize:
      $ref: ./schemas/upload-size.schema.json
    ReceiptResponse:
      $ref: ./schemas/receipt-response.schema.json
    BackfillResponse:
      $ref: ./schemas/backfill-response.schema.json
    HeartbeatResponse:
      $ref: ./schemas/heartbeat-response.schema.json
    PolicyETag:
      type: string
      pattern: "^\"p(0|[1-9][0-9]*)\\.[0-9a-f]{64}\\.e(0|[1-9][0-9]*)\"$"
      description: >
        强 ETag 的字节，含两侧双引号。格式 "p<policyVersion>.<rulesHashHex>.e<engineRevision>"。
        rulesHashHex 为 64 位小写十六进制，不含 sha256:。
    AdapterParseFailure:
      $ref: ./schemas/adapter-parse-failure.schema.json
      description: 本地 adapter 解析失败。不是成功事件，也不是本文件里的 HTTP 成功正文。errorCode 取自 failureClass 映射，见 adapter schema。
    ErrorCode:
      description: r3 两组代码。第一组是 v1 实际发出的 code。第二组是 v2 parse-failure code。不是协议冻结。
      oneOf:
        - const: payload_too_large
          description: 请求正文超过 262144 字节。
          x-remediation: 发送不超过该上限的完整正文。不要把保留前缀当成成功事件重试。
        - const: bad_json
          description: 正文不是一个 JSON 值。
          x-remediation: 发送一个合式 JSON 值。不要原样重试同一段字节。
        - const: bad_schema
          description: JSON 值不符合该路由的结构。
          x-remediation: 按该路由的 schema 重发。不要静默丢掉未知字段。
        - const: unauthorized
          description: 设备 bearer token 缺失、无效，或正文 device.id 与 token 的设备不一致。
          x-remediation: 出示该设备的 bearer token。正文设备 id 与 token 不一致时同样是 401，不另设错误码。
        - const: forbidden
          description: 已认证设备没有权限更新目标事件，沿用 v1 回执的 403。
          x-remediation: 使用拥有该事件的设备身份，不要把拒绝当成已提交。
        - const: not_found
          description: 回执目标事件不存在，沿用 v1 的 404。
          x-remediation: 核对事件标识与原始提交结果，不要自动重放结果未知的写入。
        - const: conflict
          description: 回填回执试图改变已确定的最终 enforcement，沿用 v1 的 409；不同于 event_conflict。
          x-remediation: 保留原最终 enforcement，核对已有回执，不要自动重放或改变已确定结果。
        - const: event_conflict
          description: 同一 eventId 的内容与已保存的请求不同。
          x-remediation: 换一个 eventId，或原样重发同一请求。不要把冲突当成成功。
        - const: event_protocol_incompatible
          description: 事件必须沿用首次提交的评估协议。
          x-remediation: 用原协议重试已有事件，新事件使用新标识。
        - const: evaluation_replay_unavailable
          description: 历史实现或结果不能被验证重放。
          x-remediation: 保留原事件，不要把错误当成允许或重算当前策略。
        - const: evaluation_result_too_large
          description: 新评估结果在任何会话或持久化变更之前超过客户端上限。
          x-remediation: 不截断结果，检查请求规模后使用新的事件。
        - const: event_expired
          description: 该 eventId 已有墓碑，不能再回填。
          x-remediation: 使用新的 eventId。不要复用已过期的 id。
        - const: evaluation_immutable
          description: 回执试图改变已经记录的 evaluation。
          x-remediation: 保持原 evaluation。不要对同一事件改写评估结果。
        - const: bad_receipt
          description: 回执缺少 eventId 或 enforcement 不在允许集合内。
          x-remediation: 发送 eventId 和允许的 enforcement。
        - const: bad_backfill
          description: 回填正文不能被 backfill 解析器接受。
          x-remediation: 按回填结构重发。不要把无法解析的正文记成成功。
        - const: bad_heartbeat
          description: 心跳正文不符合心跳结构。
          x-remediation: 按心跳结构重发。
        - const: storage_not_enabled
          description: 该路由需要已启用的审计存储。
          x-remediation: 启用 sqlite 审计存储后再调用。
        - const: processing_stopped
          description: 处理已停止。
          x-remediation: 等处理恢复后再调用。不要把停止当成普通允许。
        - const: policy_conflict
          description: 策略版本或规则哈希与当前已提交状态冲突。
          x-remediation: 读取 currentVersion 和 currentRulesHash 后再写。
        - const: cas_conflict
          description: compare-and-swap 的期望版本与当前版本不一致。
          x-remediation: 重新读取策略版本后再提交。
        - const: policy_recovery_required
          description: 策略存储需要恢复后才能发布。
          x-remediation: 先恢复策略存储。不要继续发布。
        - const: policy_not_committed
          description: 这次发布没有提交。
          x-remediation: 确认存储健康后再重试发布。
        - const: policy_queue_full
          description: 策略发布队列已满。
          x-remediation: 等待队列腾出位置后再发布。
        - const: audit_storage_unavailable
          description: 审计存储失败关闭。
          x-remediation: 等审计存储可用后再重试。不要把调用当成已提交。
        - const: probe_proof_required
          description: 心跳缺少探针证明。
          x-remediation: 带上探针证明后重发心跳。
        - const: internal_error
          description: 服务内部失败。
          x-remediation: 稍后重试。不要把这次调用当成已提交。
        - const: input_truncated
          description: 宿主标明工具输入被截断。
          x-remediation: 重发完整输入。不要把截断标志当成成功事件。
        - const: invalid_utf8
          description: 原始字节不是合式 UTF-8。
          x-remediation: 重发合式 UTF-8。不要做替换解码。
        - const: lone_surrogate
          description: 解码后的文本含孤立代理，成员名也包括在内。
          x-remediation: 重发没有孤立代理的文本。
        - const: duplicate_member
          description: 同一对象里，解码后的成员名出现了多次。
          x-remediation: 每个解码后的成员名只保留一次后再发。
        - const: depth_exceeded
          description: JSON 容器嵌套深度超过 64。
          x-remediation: 把容器嵌套减到 64 层或更少。不要裁剪后当成功。
        - const: extras_exceeded
          description: extraFields 超过 256 条。
          x-remediation: 减到 256 条或更少。不要静默删掉多余项。
        - const: pointer_too_long
          description: 某条 JSON Pointer 的 UTF-8 字节数超过 1024。
          x-remediation: 把每条指针缩到 1024 字节或更少。不要截断指针。
        - const: event_id_invalid
          description: eventId 为空、超过 128 个 UTF-16 码元，或含 C0/C1 控制字符。
          x-remediation: 使用 1 到 128 个 UTF-16 码元且不含 C0/C1 的 id。不要截断超长 id。
