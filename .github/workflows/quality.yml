name: Quality

# Full hosted check definition. Submitting this file does not enable branch
# protection, required status checks, or tag rules, and it is not a record
# that a hosted run has passed.
on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      baseline:
        description: Full 40-hex trusted baseline commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / ${{ matrix.os }} / Node 24
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Candidate tree is this checkout. pull_request stays on GitHub's merge
      # commit; push uses the pushed commit; workflow_dispatch uses the selected
      # ref. The guard reads only the event baseline and rejects script arguments.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install
        run: npm ci --ignore-scripts
      - name: Policy compatibility
        run: node --experimental-strip-types scripts/policy-compat-guard.mjs
      - name: Current version
        run: node scripts/check-current-version.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
