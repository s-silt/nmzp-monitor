name: Quality

# Full hosted check definition. Submitting this file does not enable branch
# protection, required status checks, or tag rules, and it is not a record
# that a hosted run has passed.
on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      baseline:
        description: Full 40-hex trusted baseline commit; empty uses merge-base with origin/<default branch>
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # A deleted ref has no tree. Skip before checkout so the job does not go red.
    if: github.event_name != 'push' || github.event.deleted != true
    name: Quality / ${{ matrix.os }} / Node 24
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Candidate tree is this checkout. pull_request stays on GitHub's merge
      # commit; push uses the pushed commit; workflow_dispatch uses the selected
      # ref. The guard reads the event baseline and rejects script arguments.
      # An all-zero push before and an empty dispatch baseline use merge-base
      # with origin/<default branch>. Fetch that ref only when it is missing.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install
        run: npm ci --ignore-scripts
      - name: Fetch default branch
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000')
        env:
          NMZP_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: "node --input-type=commonjs -e \"const {spawnSync}=require('node:child_process'); const branch=process.env.NMZP_DEFAULT_BRANCH||''; if(!branch){console.error('default branch missing'); process.exit(1);} const have=spawnSync('git',['rev-parse','--verify','--end-of-options','refs/remotes/origin/'+branch+'^{commit}'],{stdio:'ignore'}); if(have.status===0) process.exit(0); const fetched=spawnSync('git',['fetch','--no-tags','origin',branch],{stdio:'inherit'}); process.exit(fetched.status===0?0:fetched.status||1);\""
      - name: Policy compatibility
        run: node --experimental-strip-types scripts/policy-compat-guard.mjs
      - name: Current version
        run: node scripts/check-current-version.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # 打包测试（scripts/build.test.mjs、hook-bytes-golden）需要真实 dist/，先构建 UI。
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
